# main へ push するたびに、ビルドした dist/ を GitHub Pages へ公開する（テスター向けの試遊版）
# 公開リポジトリ（night-parade-evening-walk）でだけ動かす。非公開の開発用リポジトリには同じファイルを置くが、何もしない
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.repository == 'jigsawrin/night-parade-evening-walk'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
